<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Excellent SMP — Schedule</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: #000;
  color: #fff;
  font-family: 'IBM Plex Mono', monospace;
  min-height: 100vh;
}

.page {
  max-width: 820px;
  margin: 0 auto;
  padding: 40px 24px 80px;
}

/* ── TOP BAR ── */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: 16px;
  border-bottom: 1px solid #333;
  margin-bottom: 40px;
  font-size: 11px;
  letter-spacing: 0.15em;
  color: #555;
  text-transform: uppercase;
}
.topbar .brand { color: #fff; }
#topbarClock { color: #555; }

/* ── LOGO ── */
.logo-wrap {
  display: flex;
  justify-content: center;
  margin-bottom: 40px;
}
.logo-wrap canvas {
  image-rendering: pixelated;
  filter: grayscale(1) contrast(1.2);
  height: 52px;
  width: auto;
}

/* ── LIVE CARD ── */
.live-card {
  border: 1px solid #333;
  padding: 28px 32px;
  margin-bottom: 48px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 32px;
  align-items: center;
}

.status-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}

.status-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #333;
  flex-shrink: 0;
}
.status-dot.live {
  background: #fff;
  animation: blink 1s step-end infinite;
}
.status-dot.soon { background: #888; }

@keyframes blink {
  0%,100% { opacity:1; }
  50%      { opacity:0; }
}

.status-label {
  font-size: 10px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: #555;
}
.status-label.live  { color: #fff; }
.status-label.soon  { color: #888; }

.countdown-label {
  font-size: 9px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: #444;
  margin-bottom: 6px;
}

.countdown-value {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 3.2rem;
  letter-spacing: 0.03em;
  line-height: 1;
  color: #fff;
}

.countdown-sub {
  font-size: 10px;
  color: #555;
  margin-top: 6px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.session-now {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid #222;
  font-size: 9px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: #555;
}

.sess-badge {
  padding: 2px 8px;
  border: 1px solid #fff;
  font-size: 9px;
  letter-spacing: 0.15em;
  color: #fff;
}

/* right side of live card: tz info */
.tz-info { border-left: 1px solid #222; padding-left: 32px; }

.tz-row {
  display: flex;
  flex-direction: column;
  gap: 3px;
  margin-bottom: 14px;
}
.tz-row:last-child { margin-bottom: 0; }

.tz-key {
  font-size: 9px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: #444;
}
.tz-val {
  font-size: 11px;
  color: #ccc;
  letter-spacing: 0.05em;
}

/* ── TABLE ── */
.table-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

.section-label {
  font-size: 9px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: #444;
}

table {
  width: 100%;
  border-collapse: collapse;
}

thead th {
  font-size: 9px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: #444;
  font-weight: 400;
  padding: 8px 12px;
  text-align: left;
  border-bottom: 1px solid #333;
}

tbody tr { border-bottom: 1px solid #1a1a1a; }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: #0d0d0d; }
tbody tr.today-row { background: #111; }
tbody tr.today-row td:first-child { border-left: 2px solid #fff; }

td { padding: 14px 12px; vertical-align: middle; }

.td-day {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #fff;
  white-space: nowrap;
}

.today-pip {
  display: inline-block;
  width: 5px; height: 5px;
  border-radius: 50%;
  background: #fff;
  margin-left: 7px;
  vertical-align: middle;
  animation: blink 1s step-end infinite;
}

.session-cell { display: flex; flex-direction: column; gap: 4px; }

.sess { display: flex; align-items: center; gap: 8px; }

.sess-marker {
  font-size: 8px;
  letter-spacing: 0.12em;
  color: #444;
  width: 14px;
  flex-shrink: 0;
}

.sess-time {
  font-size: 12px;
  color: #ccc;
}
.sess-time.bright { color: #fff; }

.live-tag {
  font-size: 8px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: #fff;
  border: 1px solid #fff;
  padding: 1px 6px;
}

.col-div { width: 1px; background: #222; padding: 0 !important; }

footer {
  margin-top: 40px;
  padding-top: 16px;
  border-top: 1px solid #1a1a1a;
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
  font-size: 10px;
  color: #333;
  letter-spacing: 0.06em;
}

@media (max-width: 600px) {
  .live-card { grid-template-columns: 1fr; }
  .tz-info { border-left: none; border-top: 1px solid #222; padding-left: 0; padding-top: 20px; }
  .countdown-value { font-size: 2.4rem; }
}
</style>
</head>
<body>
<div class="page">

  <div class="topbar">
    <span class="brand">// Excellent SMP · Online Schedule</span>
    <span id="topbarClock">--:--:--</span>
  </div>

  <div class="logo-wrap">
    <canvas id="logoCanvas"></canvas>
  </div>

  <!-- LIVE CARD -->
  <div class="live-card" id="liveCard">
    <div>
      <div class="status-row">
        <div class="status-dot" id="statusDot"></div>
        <span class="status-label" id="statusLabel">LOADING</span>
      </div>
      <div class="countdown-label" id="cdLabel">NEXT SESSION IN</div>
      <div class="countdown-value" id="cdValue">--:--:--</div>
      <div class="countdown-sub"  id="cdSub"></div>
      <div class="session-now" id="sessionNow" style="display:none"></div>
    </div>
    <div class="tz-info">
      <div class="tz-row">
        <span class="tz-key">Your timezone</span>
        <span class="tz-val" id="yourTz">—</span>
      </div>
      <div class="tz-row">
        <span class="tz-key">EU (Poland)</span>
        <span class="tz-val" id="euTz">—</span>
      </div>
      <div class="tz-row">
        <span class="tz-key">NA (Kansas)</span>
        <span class="tz-val" id="naTz">—</span>
      </div>
    </div>
  </div>

  <!-- TABLE -->
  <div>
    <div class="table-header">
      <span class="section-label">// Weekly Schedule</span>
    </div>
    <table>
      <thead>
        <tr>
          <th>Day</th>
          <th>Sess</th>
          <th>Your Time</th>
          <td class="col-div"></td>
          <th>NA · Kansas</th>
          <td class="col-div"></td>
          <th>EU · Poland</th>
        </tr>
      </thead>
      <tbody id="scheduleBody"></tbody>
    </table>
  </div>

  <footer>
    <span>Times auto-converted to your local timezone</span>
    <span id="footerNote"></span>
  </footer>
</div>

<script>
const SCHEDULE = [
  { day:'Monday',   s1:[16,20],   s2:[20.5,24.5] },
  { day:'Thursday', s1:[16,20],   s2:[20.5,24.5] },
  { day:'Friday',   s1:[16,20],   s2:[20.5,24.5] },
  { day:'Saturday', s1:[14,18],   s2:[18.5,22.5] },
  { day:'Sunday',   s1:[14,18],   s2:[18.5,22.5] },
];
const DAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

function getOffset(tz, date) {
  try {
    const s = date.toLocaleString('en-GB',{timeZone:tz,timeZoneName:'short'});
    const m = s.match(/GMT([+-]\d+)/);
    if (m) return parseInt(m[1]);
  } catch(e){}
  return 0;
}

function cetToTZ(cetH, cetOff, targetOff) {
  return (((cetH - cetOff + targetOff) % 24) + 24) % 24;
}

function fmt12(h) {
  const t = Math.round(h*60), hh=Math.floor(t/60)%24, mm=t%60;
  const p=hh>=12?'PM':'AM', h12=hh%12||12;
  return mm ? `${h12}:${String(mm).padStart(2,'0')} ${p}` : `${h12}:00 ${p}`;
}

function fmt24(h) {
  const t=Math.round(h*60), hh=Math.floor(t/60)%24, mm=t%60;
  return `${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
}

function pad(n){ return String(Math.floor(n)).padStart(2,'0'); }

function buildSessions(cetOff) {
  const sessions=[], now=new Date();
  for(let d=0;d<14;d++){
    const date=new Date(now);
    date.setDate(date.getDate()+d);
    const name=DAY_NAMES[date.getDay()];
    const entry=SCHEDULE.find(s=>s.day===name);
    if(!entry) continue;
    [entry.s1,entry.s2].forEach((s,i)=>{
      const midnight=Date.UTC(date.getFullYear(),date.getMonth(),date.getDate());
      sessions.push({
        day:name, session:i+1,
        startEpoch: midnight+(s[0]-cetOff)*3600000,
        endEpoch:   midnight+(s[1]-cetOff)*3600000,
        cetStart:s[0], cetEnd:s[1]
      });
    });
  }
  return sessions.sort((a,b)=>a.startEpoch-b.startEpoch);
}

function renderTable(cetOff, userOff, ksOff, cetName, ksName) {
  const today=DAY_NAMES[new Date().getDay()];
  const now=new Date(), nowH=now.getHours()+now.getMinutes()/60;
  const tbody=document.getElementById('scheduleBody');
  tbody.innerHTML='';
  SCHEDULE.forEach(e=>{
    const isToday=e.day===today;
    const s1L=[cetToTZ(e.s1[0],cetOff,userOff), cetToTZ(e.s1[1],cetOff,userOff)];
    const s2L=[cetToTZ(e.s2[0],cetOff,userOff), cetToTZ(e.s2[1],cetOff,userOff)];
    const s1K=[cetToTZ(e.s1[0],cetOff,ksOff),   cetToTZ(e.s1[1],cetOff,ksOff)];
    const s2K=[cetToTZ(e.s2[0],cetOff,ksOff),   cetToTZ(e.s2[1],cetOff,ksOff)];
    const s1Live=isToday && nowH>=s1L[0] && nowH<s1L[1];
    const s2Live=isToday && (s2L[1]>s2L[0] ? (nowH>=s2L[0]&&nowH<s2L[1]) : (nowH>=s2L[0]||nowH<s2L[1]));

    const tr=document.createElement('tr');
    if(isToday) tr.className='today-row';
    tr.innerHTML=`
      <td><span class="td-day">${e.day}</span>${isToday?'<span class="today-pip"></span>':''}</td>
      <td>
        <div class="session-cell">
          <div class="sess"><span class="sess-marker">S1</span></div>
          <div class="sess"><span class="sess-marker">S2</span></div>
        </div>
      </td>
      <td>
        <div class="session-cell">
          <div class="sess"><span class="sess-time bright">${fmt12(s1L[0])} – ${fmt12(s1L[1])}</span>${s1Live?'<span class="live-tag">LIVE</span>':''}</div>
          <div class="sess"><span class="sess-time">${fmt12(s2L[0])} – ${fmt12(s2L[1])}</span>${s2Live?'<span class="live-tag">LIVE</span>':''}</div>
        </div>
      </td>
      <td class="col-div"></td>
      <td>
        <div class="session-cell">
          <div class="sess"><span class="sess-time">${fmt12(s1K[0])} – ${fmt12(s1K[1])} <span style="color:#444">${ksName}</span></span></div>
          <div class="sess"><span class="sess-time">${fmt12(s2K[0])} – ${fmt12(s2K[1])} <span style="color:#444">${ksName}</span></span></div>
        </div>
      </td>
      <td class="col-div"></td>
      <td>
        <div class="session-cell">
          <div class="sess"><span class="sess-time">${fmt24(e.s1[0])} – ${fmt24(e.s1[1])} <span style="color:#444">${cetName}</span></span></div>
          <div class="sess"><span class="sess-time">${fmt24(e.s2[0])} – ${fmt24(e.s2[1])} <span style="color:#444">${cetName}</span></span></div>
        </div>
      </td>`;
    tbody.appendChild(tr);
  });
}

function updateCard(sessions) {
  const now=Date.now();
  const dot=document.getElementById('statusDot');
  const lbl=document.getElementById('statusLabel');
  const cdL=document.getElementById('cdLabel');
  const cdV=document.getElementById('cdValue');
  const cdS=document.getElementById('cdSub');
  const sni=document.getElementById('sessionNow');

  const live=sessions.find(s=>now>=s.startEpoch&&now<s.endEpoch);
  if(live){
    dot.className='status-dot live';
    lbl.className='status-label live'; lbl.textContent='LIVE NOW';
    cdL.textContent='SESSION ENDS IN';
    let diff=(live.endEpoch-now)/1000;
    const h=Math.floor(diff/3600); diff-=h*3600;
    const m=Math.floor(diff/60);   diff-=m*60;
    const s=Math.floor(diff);
    cdV.textContent=`${pad(h)}:${pad(m)}:${pad(s)}`;
    cdS.textContent=live.day;
    sni.style.display='flex';
    sni.innerHTML=`<span>Currently on</span><span class="sess-badge">SESSION ${live.session}</span>`;
    return;
  }

  sni.style.display='none';
  const next=sessions.find(s=>s.startEpoch>now);
  if(!next){ dot.className='status-dot'; lbl.className='status-label'; lbl.textContent='OFFLINE'; cdL.textContent=''; cdV.textContent='--:--:--'; cdS.textContent=''; return; }

  let diff=(next.startEpoch-now)/1000;
  const days=Math.floor(diff/86400); diff-=days*86400;
  const h=Math.floor(diff/3600); diff-=h*3600;
  const m=Math.floor(diff/60);   diff-=m*60;
  const s=Math.floor(diff);

  dot.className='status-dot soon';
  lbl.className='status-label soon'; lbl.textContent='OFFLINE';
  cdL.textContent='NEXT SESSION IN';
  cdV.textContent=days>0?`${days}d ${pad(h)}h ${pad(m)}m`:`${pad(h)}:${pad(m)}:${pad(s)}`;
  cdS.textContent=`Session ${next.session} · ${next.day}`;
}

let sessions=[];

function init() {
  const now=new Date();
  const cetOff=getOffset('Europe/Warsaw',now);
  const ksOff=getOffset('America/Chicago',now);
  const userOff=-now.getTimezoneOffset()/60;
  const cetName=cetOff===2?'CEST':'CET';
  const ksName=ksOff===-5?'CDT':'CST';
  const tzName=Intl.DateTimeFormat().resolvedOptions().timeZone;
  const sign=userOff>=0?'+':'-';
  const utcStr=`UTC${sign}${Math.abs(userOff)}`;

  document.getElementById('yourTz').textContent=`${tzName.replace(/_/g,' ')} (${utcStr})`;
  document.getElementById('euTz').textContent=`${cetName} · UTC+${cetOff}`;
  document.getElementById('naTz').textContent=`${ksName} · UTC${ksOff}`;
  document.getElementById('footerNote').textContent=`EU: Poland ${cetName} · NA: Kansas ${ksName}`;

  sessions=buildSessions(cetOff);
  renderTable(cetOff,userOff,ksOff,cetName,ksName);
}

function tick(){
  const n=new Date();
  document.getElementById('topbarClock').textContent=
    `${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())}`;
  updateCard(sessions);
}

// Draw logo

    c.height=52;
    const ctx=c.getContext('2d');
    ctx.imageSmoothingEnabled=false;
    ctx.drawImage(img,0,0,c.width,c.height);
  };
  img.src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAAAChnVFJDAAABZAAAAChiVFJDAAABZAAAAChjcHJ0AAABjAAAADxtbHVjAAAAAAAAAAEAAAAMZW5VUwAAAAgAAAAcAHMAUgBHAEJYWVogAAAAAAAAb6IAADj1AAADkFhZWiAAAAAAAABimQAAt4UAABjaWFlaIAAAAAAAACSgAAAPhAAAts9YWVogAAAAAAAA9tYAAQAAAADTLXBhcmEAAAAAAAQAAAACZmYAAPKnAAANWQAAE9AAAApbAAAAAAAAAABtbHVjAAAAAAAAAAEAAAAMZW5VUwAAACAAAAAcAEcAbwBvAGcAbABlACAASQBuAGMALgAgADIAMAAxADb/2wBDAAUDBAQEAwUEBAQFBQUGBwwIBwcHBw8LCwkMEQ8SEhEPERETFhwXExQaFRERGCEYGh0dHx8fExciJCIeJBweHx7/2wBDAQUFBQcGBw4ICA4eFBEUHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh7/wAARCABEAeADASIAAhEBAxEB/8QAHAAAAgMBAQEBAAAAAAAAAAAAAAcFBggDBAIB/8QAVBAAAQIEAgMJCQwIBAQHAAAAAQIDAAQFEQYHEiGSCBMWFzFBU1TRFCI2UWFxcpGyMjM3QlJzdIGhscHhFSM1VZPC0tNig4SiNGOC8CRDRIWUo7P/xAAaAQACAwEBAAAAAAAAAAAAAAAABQIDBAYB/8QAOBEAAQMCAQkGBQIHAQAAAAAAAQACAwQRBRITITFRcYHR8BU0QWGhsSIyM1PBUpEGFCMkNXLhQv/aAAwDAQACEQMRAD8AjMcYll8KUqXnXpVLqFmytXuQBe8UtvOijLBKZRoekSPvEevdDeBst51ezFXyiy9w3ifB7c7PSyzNb4rTdLq9ffEAAJIAAAHKCbk67WA52KGnbTiWUHSbe65Cnp6NtI2ecE3JGjj5+Sn+OSkdUY24OOSkdUY24kTkxhEj3hQ/zHP64BkxhEcrCj53HP649ysP2H1Rl4RsPrzUdxyUjqjG3BxyUjqjG3EkcmMIHkl1DzOOf1xQsx8vaDRcQYep0mHm2qhONsvKQs6WitYSbaRUAQOTV57xZEyhldktB9VdBHhc7shgN+PhxVr45KR1Rjbg45KR1RjbiVXk9gx2YU+inJabWdJLIeeKUA8wJcufrMVvMTK/DNGw0/PybCm3dJKUlLizo3PNpKI5ra78sRjFBI4NANzv5qEQwqV4Y1pud/Ne/jkpHVGNuDjkpHVGNuPLgPK/ClcwdSqi9KOB91gKeUp5ZLijrJ1KAA12AI5ALkm5M7MZOYPKNJMkEaIv3rr2vz3cMRvQA2IPXFRJwkHJLTfjzUZxyUjqjG3BxyUjqjG3Gceg+BimZy8aEjLSmVyoKt8YbGlbVe0OBl+RZOYXJye/pVdCQEpANydW0jzXi5tn9R3HJSOqMbcHHJSOqMbcYBNS8jlnQqNh9P6ksw0i0yXEhLqVJLaioFkJIKQvWCDax5YxnOvHNQwJh2VnGJVCy+6ptTSXXCBYm+gnnv2osxBLW0NF/VVY5hEM9rqiK5+/vzWxxyUjqjG3BxyUjqjG3CzjnKiblZJyflHHFNqcZSVNrUhSCQRqKSCDr8sdOM })();

init();
tick();
setInterval(tick,1000);
setInterval(init,60000);
</script>
</body>
